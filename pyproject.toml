[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rooom-infer"
version = "0.3.0"
description = "Adaptive LLM inference control plane"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "See LICENSE"}
authors = [{name = "ROOOMTECH"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
rooom-infer = "rooomvllm.cli:main"
rooomvllm = "rooomvllm.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
