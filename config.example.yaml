version: "0.1.0"
bind: "0.0.0.0"
port: 8000
health_interval_seconds: 10

routing:
  mode: balanced
  latency_weight: 1.0
  load_weight: 350.0
  cost_weight: 500.0
  priority_weight: 10.0
  hedge_delay_ms: 120
  failure_threshold: 3
  circuit_open_seconds: 30

cache:
  enabled: true
  ttl_seconds: 30
  max_entries: 2048

# Empty means anonymous access is allowed.
tenant_keys: {}
tenants:
  anonymous:
    requests_per_minute: 600
    max_concurrency: 32

# base_url is retained by the current config schema but the embedded LocalVLLMDriver
# does not make outbound HTTP calls; model execution happens in this process.
backends:
  - name: embedded-qwen
    base_url: local://embedded-qwen
    models: [Qwen/Qwen3-0.6B]
    default_model: Qwen/Qwen3-0.6B
    model_aliases:
      fast-chat: Qwen/Qwen3-0.6B
    priority: 10
    weight: 1.0
    max_concurrency: 32
    cost_input_per_million: 0.0
    cost_output_per_million: 0.0
    tags:
      mode: embedded
