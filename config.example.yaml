version: "0.1.0"
bind: "0.0.0.0"
port: 8000
health_interval_seconds: 10
# admin_token: "change-me"

routing:
  mode: balanced
  latency_weight: 1.0
  load_weight: 350.0
  cost_weight: 500.0
  priority_weight: 10.0
  hedge_delay_ms: 120
  failure_threshold: 3
  circuit_open_seconds: 30

cache:
  enabled: true
  ttl_seconds: 30
  max_entries: 2048

# If tenant_keys is empty, anonymous access is allowed.
# When configured, clients use Authorization: Bearer <gateway-key>.
tenant_keys:
  demo-key: demo

tenants:
  anonymous:
    requests_per_minute: 120
    max_concurrency: 8
  demo:
    requests_per_minute: 1200
    max_concurrency: 64

backends:
  - name: vllm-a
    base_url: http://vllm-a:8000
    models: [meta-llama/Llama-3.3-70B-Instruct]
    model_aliases:
      fast-chat: meta-llama/Llama-3.3-70B-Instruct
    default_model: meta-llama/Llama-3.3-70B-Instruct
    priority: 10
    weight: 1.0
    max_concurrency: 128
    timeout_s: 120
    cost_input_per_million: 0.15
    cost_output_per_million: 0.60
    tags:
      gpu: H100
      zone: a

  - name: vllm-b
    base_url: http://vllm-b:8000
    models: [meta-llama/Llama-3.3-70B-Instruct]
    default_model: meta-llama/Llama-3.3-70B-Instruct
    priority: 10
    weight: 1.0
    max_concurrency: 128
    timeout_s: 120
    cost_input_per_million: 0.12
    cost_output_per_million: 0.55
    tags:
      gpu: B200
      zone: b
